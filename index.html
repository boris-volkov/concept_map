<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mathematics Concept Atlas</title>
  <meta name="description" content="A zoomable map of mathematics from counting to calculus, showing how every idea builds on the ones before it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f3ead7'/%3E%3Cpath d='M18 44 L32 20 L46 44' fill='none' stroke='%237a5a2e' stroke-width='3'/%3E%3Ccircle cx='18' cy='44' r='6' fill='%238f2d2d'/%3E%3Ccircle cx='32' cy='20' r='6' fill='%23a06a1c'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%232f4f86'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/atlas.css">
  <!-- Fetch every script at once, instead of each only after the one that imports it. -->
  <link rel="modulepreload" href="js/content.js">
  <link rel="modulepreload" href="js/map.js">
  <link rel="modulepreload" href="js/docs.js">
  <link rel="modulepreload" href="js/search.js">
  <link rel="modulepreload" href="js/markdown.js">
  <link rel="modulepreload" href="js/tex.js">
  <link rel="modulepreload" href="js/quiz.js">
  <link rel="modulepreload" href="js/model.js">
  <link rel="modulepreload" href="js/layout.js">
  <link rel="modulepreload" href="js/camera.js">
  <link rel="modulepreload" href="js/progress.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span class="brand-title" id="atlas-title">Mathematics Concept Atlas</span>
    </div>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="Find a concept…" autocomplete="off" spellcheck="false"
             aria-label="Find a concept" aria-controls="search-results" aria-expanded="false">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <ul id="search-results" role="listbox" hidden></ul>
    </div>
    <nav class="tools" aria-label="Map controls">
      <button id="btn-expand" type="button" title="Open every topic">Open all</button>
      <button id="btn-overview" type="button" title="Close everything and show the whole map (H)">Close all</button>
      <button id="btn-index" type="button" title="Every concept as a list, beside the map (I)" aria-controls="panel" aria-expanded="false">Index</button>
    </nav>
  </header>

  <!-- The index: every concept, domain by domain, in a panel beside the map. It comes before the
       map so that the stylesheet can make room for it. -->
  <aside id="panel" aria-labelledby="panel-title" hidden>
    <header class="panel-head">
      <h2 id="panel-title">Index</h2>
      <button type="button" class="shut" title="Close (I)" aria-label="Close the index">×</button>
    </header>
    <div class="panel-body index"></div>
  </aside>

  <main id="viewport" aria-label="Concept map">
    <div id="world">
      <div id="grid" aria-hidden="true"></div>
      <svg id="edges" aria-hidden="true">
        <!-- Arrowheads: filled triangles in each arrow's own colour. The line stops where the
             triangle starts, so a thick line never covers the point. At the start of a two-way
             arrow the same triangle turns round, to point back at the box it leaves. -->
        <defs>
          <marker id="head" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0,0.8 L10,5 L0,9.2 Z" fill="context-stroke"/>
          </marker>
          <marker id="head-lit" viewBox="0 0 17 15" refX="7" refY="7.5" markerWidth="17" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path d="M0,0 L17,7.5 L0,15 Z" fill="context-stroke"/>
          </marker>
        </defs>
      </svg>
    </div>
    <p id="loading">Unrolling the map…</p>
  </main>

  <div id="zoom" aria-label="Zoom">
    <button id="btn-zoom-in" type="button" title="Zoom in (+)">+</button>
    <button id="btn-zoom-out" type="button" title="Zoom out (−)">−</button>
    <button id="btn-fit" type="button" title="Fit to screen (0)">⤢</button>
  </div>

  <div id="key" hidden>
    <span class="key-pre">Prerequisite</span>
    <span class="key-sel">Selected</span>
    <span class="key-post">Required for</span>
  </div>

  <p id="hint">Click a domain, a topic or a concept to open it · scroll to zoom, drag to pan</p>

  <button id="issues" type="button" hidden></button>
  <div id="issues-list" hidden></div>
</body>
</html>
